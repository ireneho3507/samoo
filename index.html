:root{

*{box-sizing:border-box;}
.grw{ font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; background:var(--bg); color:var(--text); min-height:100%; padding:0; margin:0; }
.grw h1,.grw h2,.grw h3,.grw .disp{ font-family:'Noto Serif TC','PingFang TC',serif; color:var(--ink); }
.grw h2{ font-size:20px; margin:0 0 10px; }
.grw h3{ font-size:16px; margin:0 0 10px; }
.grw-wrap{ max-width:1080px; margin:0 auto; padding:24px 18px 70px; }
.grw button{ font-family:inherit; cursor:pointer; border:none; border-radius:10px; padding:11px 18px; font-size:14px; font-weight:700; transition:transform .08s ease, opacity .15s, box-shadow .15s; }
.grw button:active{ transform:scale(.97); }
.grw button:disabled{ opacity:.35; cursor:not-allowed; }
.btn-gold{ background:linear-gradient(180deg,#dda23f,var(--gold)); color:#3a2707; box-shadow:0 2px 8px rgba(201,138,43,.35); }
.btn-coral{ background:var(--coral); color:#fff5f3; box-shadow:0 2px 8px rgba(176,58,58,.25); }
.btn-line{ background:#fff; border:1.5px solid var(--line) !important; color:var(--ink); }
.btn-sage{ background:var(--sage); color:#f2fbf5; box-shadow:0 2px 8px rgba(63,122,82,.25); }
.grw input,.grw select,.grw textarea{ font-family:inherit; background:#fff; border:1.5px solid var(--line); color:var(--text); border-radius:8px; padding:9px 11px; font-size:14px; width:100%; }
.grw input:focus,.grw select:focus,.grw textarea:focus{ outline:none; border-color:var(--gold); }
.grw .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; box-shadow:var(--shadow); }
.grw .paper{ background:var(--paper); color:var(--ink); border-radius:10px; padding:14px 16px; border:1px solid #ecdfb8; line-height:1.6; }
.grw .muted{ color:var(--muted); font-size:13px; }
.grw .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.grw .stamp{ display:inline-block; border:3px solid var(--coral); color:var(--coral); border-radius:50%; padding:6px 12px; font-family:'Noto Serif TC',serif; font-weight:700; transform:rotate(-8deg); font-size:13px; letter-spacing:2px; }
.grw .pill{ display:inline-block; padding:3px 12px; border-radius:20px; font-size:12px; font-weight:700; background:var(--panel2); border:1px solid var(--line); color:var(--ink); }
.grw .goldtext{ color:var(--gold); }
.grw .coraltext{ color:var(--coral); }
.grw .sagetext{ color:var(--sage); }
.grw .roomcode{ font-family:'Noto Serif TC',serif; font-size:44px; letter-spacing:12px; color:var(--gold); font-weight:700; }
.grw .board{ display:grid; grid-template-columns:repeat(11,minmax(0,1fr)); grid-template-rows:repeat(11,56px); gap:3px; background:var(--panel2); border-radius:12px; padding:8px; border:1px solid var(--line); }
.grw .tile{ background:#fff; border-radius:5px; font-size:9px; padding:3px; position:relative; overflow:hidden; border:1px solid var(--line); line-height:1.25; color:var(--ink); }
.grw .tile b{ display:block; font-size:9.5px; color:var(--muted); font-weight:700; }
.grw .tile.corner{ background:#fbf2dc; border-color:var(--gold-soft); }
.grw .pawn{ display:inline-block; width:15px; height:15px; border-radius:50%; font-size:9px; text-align:center; line-height:15px; color:#fff; font-weight:800; margin-right:1px; box-shadow:0 1px 2px rgba(0,0,0,.25); }
.grw .center{ grid-column:2/11; grid-row:2/11; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; background:var(--panel); border-radius:10px; }
.grw .playerlist{ display:flex; flex-direction:column; gap:8px; }
.grw .prow{ display:flex; justify-content:space-between; align-items:center; background:var(--panel2); padding:9px 12px; border-radius:9px; font-size:13px; border:1px solid transparent; }
.grw .prow.active{ border-color:var(--gold); background:#fdf3de; }
.grw .statgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
.grw .statgrid div{ background:var(--panel2); border-radius:10px; padding:10px 4px; }
.grw .statgrid .n{ font-size:20px; font-weight:800; font-family:'Noto Serif TC',serif; color:var(--gold); }
.grw .statgrid .ic{ font-size:15px; }
.grw .statgrid .l{ font-size:11px; color:var(--muted); }
.grw .log{ max-height:180px; overflow-y:auto; font-size:12.5px; color:var(--muted); background:var(--panel2); border-radius:10px; padding:10px 12px; line-height:1.7; }
.grw .log div{ margin-bottom:5px; padding-bottom:5px; border-bottom:1px dashed var(--line); }
.grw .log div:last-child{ border-bottom:none; }
.grw .taskitem{ display:flex; justify-content:space-between; align-items:center; background:var(--panel2); padding:10px 12px; border-radius:10px; margin-bottom:8px; font-size:13px; gap:8px; }
.grw .voteopt{ display:flex; justify-content:space-between; align-items:center; width:100%; }

@keyframes cardEnter{ 0%{ opacity:0; transform:translateY(-22px) rotateX(-35deg); } 60%{ opacity:1; transform:translateY(4px) rotateX(6deg); } 100%{ opacity:1; transform:translateY(0) rotateX(0); } }
.grw .card-pop{ animation:cardEnter 1.1s cubic-bezier(.2,.8,.3,1.15); transform-origin:top center; }

@keyframes floatUp{ 0%{ opacity:0; transform:translate(-50%,6px) scale(.85); } 18%{ opacity:1; transform:translate(-50%,-6px) scale(1.15); } 75%{ opacity:1; transform:translate(-50%,-24px) scale(1.05); } 100%{ opacity:0; transform:translate(-50%,-46px) scale(1); } }
.grw .fdelta{ position:absolute; left:50%; top:-8px; font-weight:800; font-size:17px; pointer-events:none; animation:floatUp 2.6s ease-out forwards; z-index:5; white-space:nowrap; text-shadow:0 1px 3px rgba(255,255,255,.9); }
.grw .fdelta.pos{ color:var(--sage); }
.grw .fdelta.neg{ color:var(--coral); }
.grw .statgrid div{ position:relative; overflow:visible; }

@keyframes bannerDrop{ 0%{ transform:translate(-50%,-140%) scale(.9); opacity:0; } 8%{ transform:translate(-50%,6%) scale(1.06); opacity:1; } 14%{ transform:translate(-50%,0) scale(1); opacity:1; } 90%{ transform:translate(-50%,0) scale(1); opacity:1; } 100%{ transform:translate(-50%,-140%) scale(.9); opacity:0; } }
@keyframes bannerGlow{ 0%,100%{ box-shadow:0 8px 28px rgba(201,138,43,.35), 0 0 0 0 rgba(255,220,120,.6); } 50%{ box-shadow:0 8px 40px rgba(201,138,43,.55), 0 0 0 10px rgba(255,220,120,0); } }
.grw .taskBanner{ position:fixed; left:50%; top:18px; transform:translate(-50%,-140%); z-index:200; background:linear-gradient(160deg,#fff3cf,#f3c968 60%,#e8a93c); color:#3a2707; border:3px solid #fff; outline:2px solid var(--gold); border-radius:18px; padding:20px 36px; font-weight:900; font-size:19px; text-align:center; max-width:92vw; animation:bannerDrop 5.5s ease-in-out forwards, bannerGlow 1.1s ease-in-out infinite; }
.grw .taskBanner .sub{ display:block; font-size:13px; font-weight:600; margin-top:4px; opacity:.75; }

@keyframes confettiFall{ 0%{ transform:translateY(-10px) rotate(0deg); opacity:1; } 100%{ transform:translateY(320px) rotate(520deg); opacity:0; } }
.grw .confettiPiece{ position:fixed; top:0; width:10px; height:16px; border-radius:2px; z-index:199; animation:confettiFall 2.4s ease-in forwards; pointer-events:none; }

@keyframes flashPulse{ 0%{ box-shadow:0 0 0 0 rgba(201,138,43,.55); } 100%{ box-shadow:0 0 0 40px rgba(201,138,43,0); } }
.grw .flashResult{ animation:flashPulse 1.6s ease-out; }

@keyframes diceSpin{ 0%,100%{ transform:scale(1) rotate(0deg); } 50%{ transform:scale(1.1) rotate(10deg); } }
.grw .diceOverlay{ position:fixed; inset:0; background:rgba(42,36,32,.5); display:flex; align-items:center; justify-content:center; z-index:300; flex-direction:column; gap:16px; }
.grw .diceBox{ background:#fff; border-radius:24px; width:130px; height:130px; display:flex; align-items:center; justify-content:center; font-size:60px; font-weight:800; font-family:'Noto Serif TC',serif; color:var(--gold); box-shadow:0 10px 40px rgba(0,0,0,.35); animation:diceSpin .22s infinite; }

.grw .charAvatar{ font-size:52px; display:inline-block; animation:charBounce 1.4s ease-in-out infinite; filter:drop-shadow(0 6px 6px rgba(0,0,0,.15)); }

.grw .pawn{ transition:none; }
@media (max-width:720px){
  .grw .board{ display:none; }
  .grw-wrap{ padding:16px 12px 60px; }
}
</style>

/* ============ 共用工具 ============ */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function roomRef(code){ return fbDb.ref('rooms/'+code); }
function genCode(){ const chars='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function aKey(i){ return 't'+i; } // 資產格key加前綴，避免Firebase把純數字索引物件誤判成陣列
function newPlayer(id,name){
 return { id, name, pos:0, funds:6, inspiration:2, stamina:5, favor:0, gp:0,
   survey:[], hiddenTaskId:null, taskProgress:0, taskDone:false, taskAnnounced:false,
   jailCount:0, bankruptCount:0, guessCorrect:0, guessWrong:0, guessedAgainstCount:0,
   taskDoneRound:null, inJail:false, favorUsedThisTurn:false };
}
function initState(hostName){
 return {
   phase:'setup', // setup -> playing -> ended
   players:[], turnOrder:[], currentIdx:0, round:1,
   assets:{}, // tileIndex -> ownerId, upgraded:bool
   pool:0,
   messageDeck:shuffle(MESSAGE_CARDS.map((_,i)=>i)),
   fateDeck:shuffle(FATE_CARDS.map((_,i)=>i).concat([SURVEY_CARD_MARKER,SURVEY_CARD_MARKER,SURVEY_CARD_MARKER,SURVEY_CARD_MARKER])),
   surveyPool:[], // {owner,q,a,used}
   storyUnlocked:[], xiaoyanFavor:0, currentStory:null, finalResolved:false, finalEnding:null,
   log:[], lastCard:null, lastEvent:null,
   guesses:[], // {guesserId,targetId,taskId,correct}
   ended:false,
 };
}

/* ============ 儲存存取（Firebase Realtime Database） ============ */
// Firebase會把空陣列/空物件直接刪除，讀回來時對應欄位會變成undefined，
// 這個函式負責補回所有初始為空集合的欄位，避免畫面讀取.length/.map時炸掉。
function normalizeState(st){
 if(!st) return st;
 st.players = st.players || [];
 st.turnOrder = st.turnOrder || [];
 st.assets = st.assets || {};
 st.messageDeck = st.messageDeck || [];
 st.fateDeck = st.fateDeck || [];
 st.surveyPool = st.surveyPool || [];
 st.storyUnlocked = st.storyUnlocked || [];
 st.log = st.log || [];
 st.guesses = st.guesses || [];
 st.players.forEach(p=>{ p.survey = p.survey || []; });
 if(st.currentStory) st.currentStory.votes = st.currentStory.votes || {};
 if(st.currentJudge) st.currentJudge.votes = st.currentJudge.votes || {};
 return st;
}
async function loadRoom(code){
 const snap = await roomRef(code).once('value'); // 錯誤直接往外拋，讓呼叫端能顯示真正原因
 return snap.exists()? normalizeState(snap.val()): null;
}
async function safeLoadRoom(code){
 try{ return await loadRoom(code); }catch(e){ console.error(e); return null; }
}
async function saveRoom(code, state){
 try{ await roomRef(code).set(state); }catch(e){ console.error(e); }
}
async function updateRoom(code, mutator){
 try{
   const res = await roomRef(code).transaction(cur=>{
     if(cur===null || cur===undefined) return cur; // 房間不存在則放棄
     normalizeState(cur);
     mutator(cur);
     return cur;
   });
   if(res.committed && res.snapshot.exists()){ STATE = normalizeState(res.snapshot.val()); return STATE; }
   return null;
 }catch(e){ console.error(e); return null; }
}
function pushLog(state, txt){ if(!state.log) state.log=[]; state.log.unshift(txt); if(state.log.length>60) state.log.length=60; }
function pushLogBatch(state, msgs){ for(let i=msgs.length-1;i>=0;i--) pushLog(state, msgs[i]); } // msgs需按時間先後順序傳入，這裡會反向推入讓畫面顯示時序正確

/* ============ 遊戲邏輯 ============ */
function ownedSideComplete(state, side, ownerId){
 const idxs = TILES.map((t,i)=>({t,i})).filter(x=>x.t.t==='asset'&&x.t.side===side).map(x=>x.i);
 return idxs.every(i=> state.assets[aKey(i)] && state.assets[aKey(i)].owner===ownerId);
}
function rentFor(state, tileIdx){
 const tile=TILES[tileIdx]; const a=state.assets[aKey(tileIdx)];
 let rent = a && a.upgraded ? tile.upgrade.rent : tile.rent;
 if(ownedSideComplete(state, tile.side, a.owner)) rent*=2;
 return rent;
}
function findPlayer(state,id){ return state.players.find(p=>p.id===id); }
function applyDelta(p, d){
 if(!d) return;
 if(d.funds) p.funds+=d.funds;
 if(d.inspiration) p.inspiration+=d.inspiration;
 if(d.stamina) p.stamina=clamp(p.stamina+d.stamina,0,5);
 if(d.favor) p.favor=clamp(p.favor+d.favor,-5,5);
 if(d.gp) p.gp+=d.gp;
 if(p.funds<0){ p.funds=2; p.pos=10; p.inJail=true; p.bankruptCount++; }
}
function sendToJail(p){ p.pos=10; p.inJail=true; p.jailCount++; }

function landOnTile(state, p, log, depth){
 depth = depth||0;
 if(depth>6){ log.push(p.name+' 連續觸發太多次效果，先在這裡打住。'); return; }
 const tile = TILES[p.pos];
 if(tile.t==='chance' || tile.t==='fate'){
   state.pendingDraw = { playerId: p.id, kind: tile.t };
   log.push(p.name+' 停在「'+tile.name+'」，準備自己抽卡！');
   return;
 }
 resolveTile(state, p, p.pos, log, depth);
}
function resolveTile(state, p, tileIdx, log, depth){
 const tile = TILES[tileIdx];
 if(tile.t==='start'){ log.push(p.name+' 停在起點・開學迎新日。'); }
 else if(tile.t==='jail'){ log.push(p.name+' 只是路過探訪進度報告地獄，純觀望，什麼事都沒發生。'); }
 else if(tile.t==='gotojail'){ sendToJail(p); log.push(p.name+' 被教授突襲抽查，直接送進進度報告地獄！'); }
 else if(tile.t==='pool'){ p.funds+=state.pool; p.stamina=clamp(p.stamina+2,0,5); log.push(p.name+' 翻找共用冰箱，獲得獎池 '+state.pool+' 經費！'); state.pool=0; }
 else if(tile.t==='tax'){ state.pool+=tile.amount; p.funds-=tile.amount; log.push(p.name+' 在'+tile.name+'（隊伍太長，用錢插隊）繳了 '+tile.amount+' 經費進獎池。'); }
 else if(tile.t==='asset'){
   const a = state.assets[aKey(tileIdx)];
   if(!a){
     p._canClaim = tileIdx; // UI will show claim button
     log.push(p.name+' 停在還沒被認領的'+tile.name+'，可以選擇要不要認領。');
   } else if(a.owner!==p.id){
     const rent = rentFor(state, tileIdx);
     p.funds -= rent; findPlayer(state,a.owner).funds += rent;
     log.push(p.name+' 經過'+tile.name+'，付了 '+rent+' 經費通行費給 '+findPlayer(state,a.owner).name+'。');
   } else { p._canUpgrade = tileIdx; log.push(p.name+' 停在自己的'+tile.name+'，什麼事都沒發生。'); }
 }
 else if(tile.t==='story'){ p._triggerStory=true; }
 else if(tile.t==='event'){ resolveEvent(state,p,tile,log,depth); }
}

   break;
  case 'showcase':{
   const r=Math.ceil(Math.random()*6);
   if(r>=4){ p.gp+=1; p.favor=clamp(p.favor+1,-5,5); log.push(p.name+' 畢業展前夕士氣高昂，GP+1、好感度+1。'); }
   else { p.stamina=clamp(p.stamina-1,0,5); log.push(p.name+' 畢業展前夕壓力山大，體力-1。'); }
   break;}
 }
}

function movePlayer(state,p,steps,log,noStartBonus){
 const old=p.pos;
 p.pos = (p.pos + steps + 400) % 40;
 if(!noStartBonus && steps>0 && p.pos<old){ p.funds+=2; p.inspiration+=3; log.push(p.name+' 經過起點，獲得新生大禮包：靈感值+3、經費+2。'); }
}

function drawMessageCard(state,p,log,depth){
 if(state.messageDeck.length===0) state.messageDeck=shuffle(MESSAGE_CARDS.map((_,i)=>i));
 const idx = state.messageDeck.pop();
 const card = MESSAGE_CARDS[idx];
 state.lastCard = {type:'message', text:card.txt+'\n→ '+card.effect, player:p.name};
 const r = card.fx();
 const moved = (r.moveTo!==undefined) || (r.rel);
 if(r.moveTo!==undefined) p.pos=r.moveTo;
 if(r.rel!==undefined) movePlayer(state,p,r.rel,log,true);
 if(r.d) applyDelta(p,r.d);
 if(r.drawFate) drawFateCard(state,p,log);
 if(r.triggerStory) p._triggerStory=true;
 log.push(p.name+' 抽到機會卡：'+card.txt+'（'+card.effect+'）');
 if(moved && !r.triggerStory) landOnTile(state,p,log,(depth||0)+1);
}
function drawFateCard(state,p,log){
 if(state.fateDeck.length===0) state.fateDeck=shuffle(FATE_CARDS.map((_,i)=>i).concat([SURVEY_CARD_MARKER,SURVEY_CARD_MARKER,SURVEY_CARD_MARKER,SURVEY_CARD_MARKER]));
 const idx = state.fateDeck.pop();
 if(idx===SURVEY_CARD_MARKER){
   const pool = state.surveyPool.filter(s=>!s.used);
   if(pool.length===0){ state.lastCard={type:'fate', text:'（問卷已經抽完囉，全場自由聊天一下）', player:p.name}; log.push(p.name+' 抽到問卷回收卡，但問卷已抽完。'); return; }
   const pick = pool[Math.floor(Math.random()*pool.length)];
   pick.used=true;
   state.lastCard = {type:'survey', text:'系學會問卷回收 — 題目：「'+pick.q+'」\n這個人的答案是：「'+pick.a+'」\n全場搶答：這是誰寫的？', player:p.name, surveyOwner:pick.owner, q:pick.q};
   log.push(p.name+' 抽到問卷回收卡（題目：'+pick.q+'）：「'+pick.a+'」');
 } else {
   const card = FATE_CARDS[idx];
   state.lastCard = {type:'fate', text:card.text+(card.effect? '\n→ '+card.effect:''), player:p.name};
   log.push(p.name+' 抽到命運卡：'+card.text);
   if(card.judged){
     state.currentJudge = { playerId:p.id, playerName:p.name, cardText:card.text, votes:{} };
     log.push('全場要投票：'+p.name+' 講的笑話到底好不好笑！');
   }
 }
}

function statBadge(playerId, stat, curVal){
 PREV_PLAYER_STATS[playerId] = PREV_PLAYER_STATS[playerId] || {};
 const prevVal = PREV_PLAYER_STATS[playerId][stat];
 PREV_PLAYER_STATS[playerId][stat] = curVal;

 const delta = curVal-prevVal;

}

// 棋子走格動畫（只有主畫面會顯示棋盤，所以只在host角色套用）
let PAWN_ANIMATING=false;
let ANIM_SEQ=0; // 每次呼叫都遞增，讓過時的動畫鏈能偵測到自己已經被取代而提早停止，避免用舊資料覆蓋新資料
function animateAndSetState(newState){
 const mySeq = ++ANIM_SEQ;
 if(ROLE!=='host' || !STATE || !newState.players){ STATE=newState; render(); detectCelebrations(newState); return; }
 if(PAWN_ANIMATING){ STATE=newState; render(); detectCelebrations(newState); return; } // 有動畫在跑，先直接顯示最新結果，讓舊動畫鏈之後自行作廢
 const moves=[];
 newState.players.forEach(np=>{
   const op = STATE.players.find(p=>p.id===np.id);
   if(op && op.pos!==np.pos){
     const fwd = (np.pos - op.pos + 40) % 40;
     const bwd = (op.pos - np.pos + 40) % 40;
     const dir = fwd<=bwd ? 1 : -1;
     const steps = Math.min(fwd,bwd);
     const path=[]; let cur=op.pos;
     for(let s=0;s<steps;s++){ cur=(cur+dir+40)%40; path.push(cur); }
     if(path.length) moves.push({id:np.id, path});
   }
 });
 if(!moves.length){ STATE=newState; render(); detectCelebrations(newState); return; }
 PAWN_ANIMATING=true;
 const stepState = JSON.parse(JSON.stringify(STATE));
 let maxLen = Math.max(...moves.map(m=>m.path.length));
 let i=0;
 function step(){
   if(mySeq!==ANIM_SEQ){ return; } // 已經被更新的資料取代，這條動畫鏈作廢，不再套用舊資料
   if(i>=maxLen){ PAWN_ANIMATING=false; STATE=newState; render(); detectCelebrations(newState); return; }
   moves.forEach(m=>{
     if(i<m.path.length){
       const pl = stepState.players.find(p=>p.id===m.id);
       if(pl) pl.pos = m.path[i];
     }
   });
   STATE=stepState; render();
   i++;
   setTimeout(step, 420);
 }
 step();
}

function bindEvents(){
 const $=id=>document.getElementById(id);
 if($('btnGoHost')) $('btnGoHost').onclick=()=>{ ROLE='host'; render(); };

 if($('btnCreateRoom')) $('btnCreateRoom').onclick=async ()=>{
   const code=genCode(); const st=initState();
   await saveRoom(code, st); ROOM=code; STATE=st; startPolling(); render();
 };

 if($('btnJoin')) $('btnJoin').onclick=async ()=>{
   const btn=$('btnJoin'); const errEl=$('joinErr');
   const code=($('inCode').value||'').toUpperCase().trim();
   const name=($('inName').value||'').trim();
   errEl.textContent='';
   if(!code||!name){ errEl.textContent='請輸入房間代碼與名字'; return; }
   btn.disabled=true; btn.textContent='連線中…';
   let timeoutHit=false;
   const timeoutId=setTimeout(()=>{ timeoutHit=true; errEl.textContent='連線逾時超過8秒，請檢查：1) 手機網路是否正常 2) Firebase資料庫規則是否已開放讀寫 3) databaseURL是否正確'; btn.disabled=false; btn.textContent='加入'; },8000);
   try{
     const st = await loadRoom(code);
     if(timeoutHit) return;
     clearTimeout(timeoutId);
     if(!st){ errEl.textContent='找不到這個房間，請確認代碼是否正確（房間代碼區分不到大小寫，但要完全一致）'; btn.disabled=false; btn.textContent='加入'; return; }
     let existing = st.players.find(pp=>pp.name===name);
     if(!existing){
       if(st.phase!=='setup'){ errEl.textContent='遊戲已經開始，無法加入新玩家'; btn.disabled=false; btn.textContent='加入'; return; }
       existing = newPlayer('p'+Date.now()+Math.floor(Math.random()*999), name);
       st.players.push(existing);
       await saveRoom(code, st);
     }
     ROOM=code; MYID=existing.id; MYNAME=name; STATE=st; startPolling(); render();
   }catch(e){
     clearTimeout(timeoutId);
     console.error(e);
     errEl.textContent='發生錯誤：'+String(e && e.message || e);
     btn.disabled=false; btn.textContent='加入';
   }
 };

       target.taskDone=true; target.taskAnnounced=true;
       target.guessedAgainstCount++;
       pushLog(st, guesser.name+' 猜中了 '+target.name+' 的隱藏任務！獎勵轉移給猜中者。');
     } else {
       guesser.funds-=1; guesser.guessWrong++;
       pushLog(st, guesser.name+' 猜錯了 '+target.name+' 的隱藏任務，經費-1。');
     }
   });
   await refresh();
 };

 document.querySelectorAll('[data-vote]').forEach(btn=>{
   btn.onclick=async ()=>{
     const v=btn.dataset.vote;
     await updateRoom(ROOM, st=>{ if(st.currentStory) st.currentStory.votes[MYID]=v; });
     await refresh();
   };
 });
 if($('btnResolveStory')) $('btnResolveStory').onclick=async ()=>{
   await updateRoom(ROOM, st=>resolveStory(st));
   await refresh();
 };

 document.querySelectorAll('[data-judge]').forEach(btn=>{
   btn.onclick=async ()=>{
     const v=btn.dataset.judge;
     await updateRoom(ROOM, st=>{ if(st.currentJudge) st.currentJudge.votes[MYID]=v; });
     await refresh();
   };
 });
 if($('btnResolveJudge')) $('btnResolveJudge').onclick=async ()=>{
   await updateRoom(ROOM, st=>resolveJudge(st));
   await refresh();
 };

 if($('btnEndGame')) $('btnEndGame').onclick=async ()=>{
   await updateRoom(ROOM, st=>{ st.phase='ended'; pushLog(st,'遊戲結束，進入結算。'); });
   await refresh();
 };
}

function triggerStory(state){
 if(state.currentStory) return;
 if(state.storyUnlocked.length<6){
   const remain = STORY_CHAPTERS.filter(c=>!state.storyUnlocked.includes(c.id));
   const pick = remain[Math.floor(Math.random()*remain.length)];
   state.currentStory = {chapterId:pick.id, votes:{}, isFinal:false};
   pushLog(state, '觸發養成故事小遊戲：《'+pick.title+'》，全場投票決定劇情走向！');
 } else if(!state.finalResolved){
   state.currentStory = {votes:{}, isFinal:true};
   pushLog(state, '6則章節全部解鎖！觸發終章〈畢業前夕的抉擇〉，全場投票決定最終結局！');
 } else {
   pushLog(state, '小研的故事已經說完了（都市傳說已無新進展）。');
 }
}
function describeEffect(r){
 const parts=[];
 function fmt(d, prefix){
   const names={funds:'經費',inspiration:'靈感值',stamina:'體力',favor:'好感度',gp:'GP'};
   const ds=[];
   Object.keys(d||{}).forEach(k=>{ if(d[k]) ds.push(names[k]+(d[k]>0?'+':'')+d[k]); });
   if(ds.length) parts.push(prefix+ds.join('、'));
 }
 if(r.xiaoyan) parts.push('小研好感度'+(r.xiaoyan>0?'+':'')+r.xiaoyan);
 fmt(r.allD, '全場');
 fmt(r.triggerD, '觸發者');
 return parts.join('，')||'（無資源效果）';
}
function resolveStory(state){
 const story=state.currentStory; if(!story) return;
 const votesA=Object.values(story.votes).filter(v=>v==='a').length;
 const votesB=Object.values(story.votes).filter(v=>v==='b').length;
 const winner = votesB>votesA? 'b':'a';
 if(story.isFinal){
   state.finalEnding = winner; state.finalResolved=true;
   pushLog(state, '終章投票結果：選項'+winner.toUpperCase()+' 勝出！');
   state.lastStoryResult = { title:FINAL_CHAPTER.title, optionLabel:FINAL_CHAPTER[winner].label, ending:null, effectSummary:null, isFinal:true };
 } else {
   const ch = STORY_CHAPTERS.find(c=>c.id===story.chapterId);
   const opt = ch[winner];
   const r = opt.fx();
   const triggerPlayer = state.players.find(p=>p.pos===36) || state.players[state.currentIdx];
   if(r.xiaoyan) state.xiaoyanFavor+=r.xiaoyan;
   if(r.allD) state.players.forEach(p=>applyDelta(p,r.allD));
   if(r.triggerD && triggerPlayer) applyDelta(triggerPlayer,r.triggerD);
   state.storyUnlocked.push(ch.id);
   const effectSummary = describeEffect(r);
   pushLog(state, '《'+ch.title+'》投票結果：選項'+winner.toUpperCase()+'勝出——'+opt.label);
   pushLog(state, opt.ending);
   pushLog(state, '效果：'+effectSummary);
   state.lastStoryResult = { title:ch.title, optionLabel:opt.label, ending:opt.ending, effectSummary, isFinal:false };
   state.currentStory=null;
   if(state.storyUnlocked.length>=6 && !state.finalResolved){ triggerStory(state); return; }
 }
 state.currentStory=null;
}
function resolveJudge(state){
 const j = state.currentJudge; if(!j) return;
 const votesFunny = Object.values(j.votes).filter(v=>v==='funny').length;
 const votesAwkward = Object.values(j.votes).filter(v=>v==='awkward').length;
 const teller = findPlayer(state, j.playerId);
 if(votesAwkward>votesFunny && teller){
   teller.stamina = clamp(teller.stamina-1,0,5);
   pushLog(state, '全場投票結果：冷場獲勝……'+j.playerName+' 體力-1。');
 } else {
   pushLog(state, '全場投票結果：好笑！'+j.playerName+' 逃過一劫，沒有扣體力。');
 }
 state.currentJudge=null;
}

/* ============ 即時同步 ============ */
let unsubRef=null;
async function refresh(){
 const st = await safeLoadRoom(ROOM);
 if(st){ animateAndSetState(st); }
}
function startPolling(){
 if(unsubRef) { unsubRef.off('value'); }
 const r = roomRef(ROOM);
 r.on('value', snap=>{
   if(snap.exists()){ animateAndSetState(normalizeState(snap.val())); }
 });
 unsubRef = r;
}

render();
})();
</script>
