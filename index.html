.grw button{ font-family:inherit; cursor:pointer; border:none; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600; transition:transform .08s ease, opacity .15s; }
.grw button:active{ transform:scale(.97); }
.grw button:disabled{ opacity:.35; cursor:not-allowed; }
.btn-gold{ background:var(--gold); color:#241a05; }
.btn-coral{ background:var(--coral); color:#fff0ee; }

.grw .card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
.grw .paper{ background:var(--paper); color:var(--ink); border-radius:10px; padding:14px 16px; }
.grw .muted{ color:var(--muted); font-size:13px; }
.grw .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.grw .stamp{ display:inline-block; border:3px solid var(--coral); color:var(--coral); border-radius:50%; padding:6px 12px; font-family:'Noto Serif TC',serif; font-weight:700; transform:rotate(-8deg); font-size:13px; letter-spacing:2px; }
.grw .pill{ display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:700; background:var(--panel2); border:1px solid var(--line); }
.grw .goldtext{ color:var(--gold); }
.grw .coraltext{ color:var(--coral); }
.grw .sagetext{ color:var(--sage); }
.grw .roomcode{ font-family:'Noto Serif TC',serif; font-size:42px; letter-spacing:10px; color:var(--gold); font-weight:700; }
.grw .board{ display:grid; grid-template-columns:repeat(11,minmax(0,1fr)); grid-template-rows:repeat(11,54px); gap:2px; background:var(--panel2); border-radius:10px; padding:6px; }
.grw .tile{ background:var(--panel); border-radius:4px; font-size:9px; padding:3px; position:relative; overflow:hidden; border:1px solid var(--line); line-height:1.2; }
.grw .tile b{ display:block; font-size:9.5px; }
.grw .tile.corner{ background:#2b2416; border-color:var(--gold); }
.grw .tile.owned{ box-shadow:inset 0 0 0 2px var(--gold); }
.grw .pawn{ display:inline-block; width:14px; height:14px; border-radius:50%; font-size:9px; text-align:center; line-height:14px; color:#161b22; font-weight:800; margin-right:1px; }
.grw .center{ grid-column:2/11; grid-row:2/11; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; }
.grw .playerlist{ display:flex; flex-direction:column; gap:6px; }
.grw .prow{ display:flex; justify-content:space-between; background:var(--panel2); padding:6px 10px; border-radius:6px; font-size:13px; }
.grw .prow.active{ outline:2px solid var(--gold); }
.grw .statgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
.grw .statgrid div{ background:var(--panel2); border-radius:8px; padding:8px 4px; }
.grw .statgrid .n{ font-size:20px; font-weight:800; font-family:'Noto Serif TC',serif; color:var(--gold); }
.grw .statgrid .l{ font-size:11px; color:var(--muted); }
.grw .log{ max-height:160px; overflow-y:auto; font-size:12px; color:var(--muted); background:var(--panel2); border-radius:8px; padding:8px 10px; }
.grw .log div{ margin-bottom:4px; }
.grw .taskitem{ display:flex; justify-content:space-between; align-items:center; background:var(--panel2); padding:8px 10px; border-radius:8px; margin-bottom:6px; font-size:13px; }
@media (max-width:720px){

  }catch(e){ fbError = String(e); fbReady=false; }
  return fbReady;
}

/* ============ 共用工具 ============ */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function roomRef(code){ return fbDb.ref('rooms/'+code); }
function genCode(){ const chars='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function aKey(i){ return 't'+i; } // 資產格key加前綴，避免Firebase把純數字索引物件誤判成陣列
function newPlayer(id,name){
 return { id, name, pos:0, funds:6, inspiration:2, stamina:5, favor:0, gp:0,
   survey:[], hiddenTaskId:null, taskProgress:0, taskDone:false, taskAnnounced:false,
   jailCount:0, bankruptCount:0, guessCorrect:0, guessWrong:0, guessedAgainstCount:0,
   taskDoneRound:null, inJail:false, favorUsedThisTurn:false };
}
function initState(hostName){
 return {
   phase:'setup', // setup -> playing -> ended
   players:[], turnOrder:[], currentIdx:0, round:1,
   assets:{}, // tileIndex -> ownerId, upgraded:bool
   pool:0,
   messageDeck:shuffle(MESSAGE_CARDS.map((_,i)=>i)),
   fateDeck:shuffle(FATE_CARDS.map((_,i)=>i).concat([SURVEY_CARD_MARKER,SURVEY_CARD_MARKER,SURVEY_CARD_MARKER,SURVEY_CARD_MARKER])),
   surveyPool:[], // {owner,q,a,used}
   storyUnlocked:[], xiaoyanFavor:0, currentStory:null, finalResolved:false, finalEnding:null,
   log:[], lastCard:null, lastEvent:null,
   guesses:[], // {guesserId,targetId,taskId,correct}
   ended:false,
 };
}

/* ============ 儲存存取（Firebase Realtime Database） ============ */
// Firebase會把空陣列/空物件直接刪除，讀回來時對應欄位會變成undefined，
// 這個函式負責補回所有初始為空集合的欄位，避免畫面讀取.length/.map時炸掉。
function normalizeState(st){
 if(!st) return st;
 st.players = st.players || [];
 st.turnOrder = st.turnOrder || [];
 st.assets = st.assets || {};
 st.messageDeck = st.messageDeck || [];
 st.fateDeck = st.fateDeck || [];
 st.surveyPool = st.surveyPool || [];
 st.storyUnlocked = st.storyUnlocked || [];
 st.log = st.log || [];
 st.guesses = st.guesses || [];
 st.players.forEach(p=>{ p.survey = p.survey || []; });
 if(st.currentStory) st.currentStory.votes = st.currentStory.votes || {};
 return st;
}
async function loadRoom(code){
 const snap = await roomRef(code).once('value'); // 錯誤直接往外拋，讓呼叫端能顯示真正原因
 return snap.exists()? normalizeState(snap.val()): null;
}
async function safeLoadRoom(code){
 try{ return await loadRoom(code); }catch(e){ console.error(e); return null; }
}
async function saveRoom(code, state){
 try{ await roomRef(code).set(state); }catch(e){ console.error(e); }
}
async function updateRoom(code, mutator){
 try{
   const res = await roomRef(code).transaction(cur=>{
     if(cur===null || cur===undefined) return cur; // 房間不存在則放棄
     normalizeState(cur);
     mutator(cur);
     return cur;
   });
   if(res.committed && res.snapshot.exists()){ STATE = normalizeState(res.snapshot.val()); return STATE; }
   return null;
 }catch(e){ console.error(e); return null; }
}
function pushLog(state, txt){ if(!state.log) state.log=[]; state.log.unshift(txt); if(state.log.length>60) state.log.length=60; }

/* ============ 遊戲邏輯 ============ */
function ownedSideComplete(state, side, ownerId){
 const idxs = TILES.map((t,i)=>({t,i})).filter(x=>x.t.t==='asset'&&x.t.side===side).map(x=>x.i);
 return idxs.every(i=> state.assets[aKey(i)] && state.assets[aKey(i)].owner===ownerId);
}
function rentFor(state, tileIdx){
 const tile=TILES[tileIdx]; const a=state.assets[aKey(tileIdx)];
 let rent = a && a.upgraded ? tile.upgrade.rent : tile.rent;
 if(ownedSideComplete(state, tile.side, a.owner)) rent*=2;
 return rent;
}
function findPlayer(state,id){ return state.players.find(p=>p.id===id); }
function applyDelta(p, d){
 if(!d) return;
 if(d.funds) p.funds+=d.funds;
 if(d.inspiration) p.inspiration+=d.inspiration;
 if(d.stamina) p.stamina=clamp(p.stamina+d.stamina,0,5);
 if(d.favor) p.favor=clamp(p.favor+d.favor,-5,5);
 if(d.gp) p.gp+=d.gp;
 if(p.funds<0){ p.funds=2; p.pos=10; p.inJail=true; p.bankruptCount++; }
}
function sendToJail(p){ p.pos=10; p.inJail=true; p.jailCount++; }

function resolveTile(state, p, tileIdx, log){
 const tile = TILES[tileIdx];
 if(tile.t==='start'){ /* handled on pass */ }
 else if(tile.t==='jail'){ /* visiting only, no effect unless sent */ }
 else if(tile.t==='gotojail'){ sendToJail(p); log.push(p.name+' 被教授突襲抽查，直接送進進度報告地獄！'); }
 else if(tile.t==='pool'){ p.funds+=state.pool; p.stamina=clamp(p.stamina+2,0,5); log.push(p.name+' 翻找共用冰箱，獲得獎池 '+state.pool+' 經費！'); state.pool=0; }
 else if(tile.t==='tax'){ state.pool+=tile.amount; p.funds-=tile.amount; log.push(p.name+' 在'+tile.name+'繳了 '+tile.amount+' 經費進獎池。'); }
 else if(tile.t==='asset'){
   const a = state.assets[aKey(tileIdx)];
   if(!a){
     p._canClaim = tileIdx; // UI will show claim button
   } else if(a.owner!==p.id){
     const rent = rentFor(state, tileIdx);
     p.funds -= rent; findPlayer(state,a.owner).funds += rent;
     log.push(p.name+' 經過'+tile.name+'，付了 '+rent+' 經費通行費給 '+findPlayer(state,a.owner).name+'。');
   } else { p._canUpgrade = tileIdx; }
 }
 else if(tile.t==='chance'){ drawMessageCard(state,p,log); }
 else if(tile.t==='fate'){ drawFateCard(state,p,log); }
 else if(tile.t==='story'){ p._triggerStory=true; }
 else if(tile.t==='event'){ resolveEvent(state,p,tile,log); }
}

function resolveEvent(state,p,tile,log){
 switch(tile.id){
  case 'copier':
   if(Math.random()<0.5){ p.stamina=clamp(p.stamina-1,0,5); log.push(p.name+' 印表機卡紙，損失1體力。'); }
   else { drawMessageCard(state,p,log); log.push(p.name+' 印表機卡紙，補一張訊息卡。'); }
   break;
  case 'journal':{
   const r=Math.ceil(Math.random()*6);
   if(r<=2){ p.funds-=3; movePlayer(state,p,-6,log,true); log.push(p.name+' 期刊投稿被 Reject，經費-3、倒退6格。'); }
   else if(r<=4){ p.stamina=clamp(p.stamina-2,0,5); log.push(p.name+' 收到 Major Revision，原地不動、扣2體力。'); }
   else { p.gp+=3; p.inspiration+=5; movePlayer(state,p,3,log,true); log.push(p.name+' 期刊投稿 Accept！GP+3、靈感值+5、前進3格。'); }
   break;}
  case 'oral':{
   const r=Math.ceil(Math.random()*6);
   if(r>=4){ p.gp+=2; p.favor=clamp(p.favor+2,-5,5); log.push(p.name+' 口頭資格考通過！GP+2、好感度+2。'); }
   else { p.favor=clamp(p.favor-1,-5,5); const prevCorner=[0,10,20,30].filter(c=>c<=p.pos).pop()||0; p.pos=prevCorner; log.push(p.name+' 口頭資格考沒過，退回上一個轉角格、好感度-1。'); }
   break;}
  case 'defense':{
   const r=Math.ceil(Math.random()*6);
   if(r>=4){ p.gp+=5; log.push(p.name+' 論文口試通過！GP+5！'); }
   else { sendToJail(p); log.push(p.name+' 論文口試失敗，被關進進度報告地獄。'); }
   break;}
  case 'welcome':
   state.players.forEach(pl=>pl.funds+=1);
   log.push('系學會迎新茶會，全場玩家經費+1。');
   break;
  case 'social':
   p.inspiration+=1; log.push(p.name+' 參加系際聯誼，靈感值+1。');
   break;
  case 'bbq':
   if(p.funds>=1){ p.funds-=1; p.stamina=clamp(p.stamina+1,0,5); log.push(p.name+' 參加系烤肉趴，花1經費回1體力。'); }
   break;
  case 'mystery':
   if(Math.random()<0.5){ p.funds+=5; log.push(p.name+' 挖到學長姐的神秘數據寶藏，經費+5！'); }
   else { movePlayer(state,p,-5,log,true); log.push(p.name+' 觸發神秘數據詛咒，倒退5格！'); }
   break;
  case 'showcase':{
   const r=Math.ceil(Math.random()*6);
   if(r>=4){ p.gp+=1; p.favor=clamp(p.favor+1,-5,5); log.push(p.name+' 畢業展前夕士氣高昂，GP+1、好感度+1。'); }
   else { p.stamina=clamp(p.stamina-1,0,5); log.push(p.name+' 畢業展前夕壓力山大，體力-1。'); }
   break;}
 }
}

function movePlayer(state,p,steps,log,noStartBonus){
 const old=p.pos;
 p.pos = (p.pos + steps + 400) % 40;
 if(!noStartBonus && steps>0 && p.pos<old){ p.funds+=2; p.inspiration+=3; log.push(p.name+' 經過起點，獲得新生大禮包：靈感值+3、經費+2。'); }
}

function drawMessageCard(state,p,log){
 if(state.messageDeck.length===0) state.messageDeck=shuffle(MESSAGE_CARDS.map((_,i)=>i));
 const idx = state.messageDeck.pop();
 const card = MESSAGE_CARDS[idx];
 state.lastCard = {type:'message', text:card.txt, player:p.name};
 const r = card.fx();
 if(r.moveTo!==undefined) p.pos=r.moveTo;
 if(r.rel!==undefined) movePlayer(state,p,r.rel,log,true);
 if(r.d) applyDelta(p,r.d);
 if(r.drawFate) drawFateCard(state,p,log);
 if(r.triggerStory) p._triggerStory=true;
 log.push(p.name+' 抽到機會卡：'+card.txt);
}
function drawFateCard(state,p,log){
 if(state.fateDeck.length===0) state.fateDeck=shuffle(FATE_CARDS.map((_,i)=>i).concat([SURVEY_CARD_MARKER,SURVEY_CARD_MARKER,SURVEY_CARD_MARKER,SURVEY_CARD_MARKER]));
 const idx = state.fateDeck.pop();
 if(idx===SURVEY_CARD_MARKER){
   const pool = state.surveyPool.filter(s=>!s.used);
   if(pool.length===0){ state.lastCard={type:'fate', text:'（問卷已經抽完囉，全場自由聊天一下）', player:p.name}; log.push(p.name+' 抽到問卷回收卡，但問卷已抽完。'); return; }
   const pick = pool[Math.floor(Math.random()*pool.length)];
   pick.used=true;
   state.lastCard = {type:'survey', text:'系學會問卷回收：「'+pick.a+'」全場搶答：這是誰寫的？', player:p.name, surveyOwner:pick.owner, q:pick.q};
   log.push(p.name+' 抽到問卷回收卡：「'+pick.a+'」');
 } else {
   state.lastCard = {type:'fate', text:FATE_CARDS[idx], player:p.name};
   log.push(p.name+' 抽到命運卡：'+FATE_CARDS[idx]);
 }
}

function computeTitles(state){
 const ps=state.players;
 function top(fn){ return ps.slice().sort((a,b)=>fn(b)-fn(a))[0]; }
 return [
  {title:'最速畢業生', who:top(p=>p.gp).name, why:'GP最高'},
  {title:'萬年苦主', who:top(p=>p.jailCount).name, why:'進監獄次數最多'},
  {title:'人緣王', who:top(p=>p.favor).name, why:'好感度最高'},
  {title:'白老鼠代表', who:top(p=>p.bankruptCount).name, why:'破產次數最多'},
  {title:'心機偵探', who:top(p=>p.guessCorrect).name, why:'猜中次數最多'},
  {title:'社死之王', who:top(p=>p.guessedAgainstCount).name, why:'被猜中次數最多'},
  {title:'財力雄厚', who:top(p=>p.funds).name, why:'經費最高'},
 ];
}
function personalEnding(p){
 if(p.gp>=8 && p.favor>=2) return {name:'順利畢業・薪火相傳', text:'口試委員陸續在成績單上簽下名字。教授在門口等你，遞給你一杯咖啡：「走吧，我請你吃飯。」'};
 if(p.gp>=8 && p.favor<=-2) return {name:'順利畢業・恩斷義絕', text:'口試通過的那一刻，你反而沒什麼特別的情緒。教授只回了一句「辛苦了」，已讀時間停在三天前。'};
 if(p.gp<4 && p.favor>=2) return {name:'轉職業界・帶著祝福離開', text:'你把離開學術這條路的決定告訴教授，他點點頭，默默幫你寫了一封很用心的推薦信。'};
 if(p.gp<4 && p.favor<=-2) return {name:'不歡而散・黯然離場', text:'最後一次meeting，你們吵了起來。你收拾東西，沒等他回應就走了。'};
 return {name:'延畢一年・捲土重來', text:'成績單上那個熟悉的「未通過」，你嘆了口氣。「我再拼一次。」你傳訊息給教授，對方秒回：「好，這次我陪你一起想辦法。」'};
}

function tileGridStyle(i){

}

     `<div>${pawnsHere.map(p=>`<span class="pawn" style="background:${PAWN_COLORS[s.players.indexOf(p)%6]}" title="${p.name}">${p.name[0]}</span>`).join('')}</div>`+
     `</div>`;
 }
 html+=`<div class="center">
   <div class="disp" style="font-size:16px;">第 ${s.round} 輪</div>
   <div class="muted">獎池：${s.pool} 經費　｜　小研好感度：${s.xiaoyanFavor}</div>
   <div class="muted">已解鎖章節：${s.storyUnlocked.length}/6</div>
 </div>`;
 html+='</div>';
 return html;
}

/* ============ 事件綁定 ============ */
function bindEvents(){
 const $=id=>document.getElementById(id);
 if($('btnGoHost')) $('btnGoHost').onclick=()=>{ ROLE='host'; render(); };
 if($('btnGoPlayer')) $('btnGoPlayer').onclick=()=>{ ROLE='player'; render(); };

 if($('btnCreateRoom')) $('btnCreateRoom').onclick=async ()=>{
   const code=genCode(); const st=initState();
   await saveRoom(code, st); ROOM=code; STATE=st; startPolling(); render();
 };

 if($('btnJoin')) $('btnJoin').onclick=async ()=>{
   const btn=$('btnJoin'); const errEl=$('joinErr');
   const code=($('inCode').value||'').toUpperCase().trim();
   const name=($('inName').value||'').trim();
   errEl.textContent='';
   if(!code||!name){ errEl.textContent='請輸入房間代碼與名字'; return; }
   btn.disabled=true; btn.textContent='連線中…';
   let timeoutHit=false;
   const timeoutId=setTimeout(()=>{ timeoutHit=true; errEl.textContent='連線逾時超過8秒，請檢查：1) 手機網路是否正常 2) Firebase資料庫規則是否已開放讀寫 3) databaseURL是否正確'; btn.disabled=false; btn.textContent='加入'; },8000);
   try{
     const st = await loadRoom(code);
     if(timeoutHit) return;
     clearTimeout(timeoutId);
     if(!st){ errEl.textContent='找不到這個房間，請確認代碼是否正確（房間代碼區分不到大小寫，但要完全一致）'; btn.disabled=false; btn.textContent='加入'; return; }
     let existing = st.players.find(pp=>pp.name===name);
     if(!existing){
       if(st.phase!=='setup'){ errEl.textContent='遊戲已經開始，無法加入新玩家'; btn.disabled=false; btn.textContent='加入'; return; }
       existing = newPlayer('p'+Date.now()+Math.floor(Math.random()*999), name);
       st.players.push(existing);
       await saveRoom(code, st);
     }
     ROOM=code; MYID=existing.id; MYNAME=name; STATE=st; startPolling(); render();
   }catch(e){
     clearTimeout(timeoutId);
     console.error(e);
     errEl.textContent='發生錯誤：'+String(e && e.message || e);
     btn.disabled=false; btn.textContent='加入';
   }
 };

 if($('btnSubmitSurvey')) $('btnSubmitSurvey').onclick=async ()=>{
   const answers = Array.from(document.querySelectorAll('.svInput')).map(inp=>inp.value.trim()||'（沒填）');
   await updateRoom(ROOM, st=>{
     const p = findPlayer(st, MYID);
     p.survey = answers;
     answers.forEach((a,i)=> st.surveyPool.push({owner:p.name, q:SURVEY_QUESTIONS[i], a, used:false}));
   });
   await refresh();
 };

 if($('btnStartGame')) $('btnStartGame').onclick=async ()=>{
   await updateRoom(ROOM, st=>{
     st.phase='playing';
     st.turnOrder = st.players.map(p=>p.id);
     const tasks = shuffle(HIDDEN_TASKS);
     st.players.forEach((p,i)=>{ p.hiddenTaskId = tasks[i%tasks.length].id; });
     pushLog(st,'遊戲開始！隱藏任務已隨機分配給每位玩家。');
   });
   await refresh();
 };

 if($('btnRoll')) $('btnRoll').onclick=async ()=>{
   await updateRoom(ROOM, st=>{
     const p = st.players[st.currentIdx];
     if(p.id!==MYID) return;
     const dice = Math.ceil(Math.random()*6);
     const log=[];
     if(p.inJail){ p.inJail=false; }
     movePlayer(st,p,dice,log);
     const oldExtras = {};
     resolveTile(st,p,p.pos,log);
     log.forEach(l=>pushLog(st,l));
     st.lastEvent = '擲出 '+dice+' 點，移動到 '+p.pos+'（'+TILES[p.pos].name+'）';
     pushLog(st, p.name+' '+st.lastEvent);
     p._rolled=true;
     if(p._triggerStory){ delete p._triggerStory; triggerStory(st); }
   });
   await refresh();
 };

 if($('btnClaim')) $('btnClaim').onclick=async ()=>{
   const tileIdx = parseInt($('btnClaim').dataset.tile,10);
   await updateRoom(ROOM, st=>{
     const p = findPlayer(st, MYID); const tile=TILES[tileIdx];
     if(p.funds>=tile.price && !st.assets[aKey(tileIdx)]){
       p.funds-=tile.price; st.assets[aKey(tileIdx)]={owner:MYID, upgraded:false};

     }
   });
   await refresh();
 };
 if($('btnUpgrade')) $('btnUpgrade').onclick=async ()=>{
   const tileIdx = parseInt($('btnUpgrade').dataset.tile,10);
   await updateRoom(ROOM, st=>{
     const p = findPlayer(st, MYID); const tile=TILES[tileIdx]; const a=st.assets[aKey(tileIdx)];
     if(a && a.owner===MYID && p.funds>=tile.upgrade.cost && !a.upgraded){
       p.funds-=tile.upgrade.cost; a.upgraded=true;
       pushLog(st, p.name+' 把 '+tile.name+' 升級為「'+tile.upgrade.name+'」！');
     }
   });
   await refresh();
 };

 if($('btnEndTurn')) $('btnEndTurn').onclick=async ()=>{
   await updateRoom(ROOM, st=>{
     const p = st.players[st.currentIdx];
     if(p.id!==MYID) return;
     p._rolled=false;
     st.currentIdx = (st.currentIdx+1)%st.players.length;
     if(st.currentIdx===0){ st.round++; }
     pushLog(st, '輪到 '+st.players[st.currentIdx].name+' 了。');

   await refresh();
 };

 if($('btnTaskProgress')) $('btnTaskProgress').onclick=async ()=>{
   await updateRoom(ROOM, st=>{
     const p = findPlayer(st, MYID); const task=HIDDEN_TASKS.find(t=>t.id===p.hiddenTaskId);
     if(!task || p.taskDone) return;
     p.taskProgress++;
     if(p.taskProgress>=task.target){
       p.taskDone=true; p.taskAnnounced=true; p.taskDoneRound=st.round;
       const rewardFunds = task.tier===2?4:3, rewardGP = task.tier===2?2:1;
       p.funds+=rewardFunds; p.gp+=rewardGP;
       pushLog(st, '🎉 '+p.name+' 完成了隱藏任務：'+task.name+'！獲得經費+'+rewardFunds+'、GP+'+rewardGP);
     }
   });
   await refresh();
 };

 document.querySelectorAll('[data-favor]').forEach(btn=>{
   btn.onclick=async ()=>{
     const id=btn.dataset.favor;
     await updateRoom(ROOM, st=>{
       const p=findPlayer(st,MYID); const f=FAVOR_MENU.find(x=>x.id===id);
       if(p.favor<f.cost) return;
       p.favor-=f.cost;
       if(id==='jail'){ p.pos=10; p.inJail=false; pushLog(st,p.name+' 花好感度凹教授通融，跳出進度報告地獄。'); }
       if(id==='toll'){ pushLog(st,p.name+' 花好感度凹教授網開一面，免除本次通行費。'); }
       if(id==='peek'){ pushLog(st,p.name+' 花好感度偷看了一眼下一張卡。'); }
       if(id==='auto'){ p.gp+=2; pushLog(st,p.name+' 花好感度讓教授特別放水，直接視為最佳結果！GP+2。'); }
     });
     await refresh();
   };
 });

 if($('btnGuess')) $('btnGuess').onclick=async ()=>{
   const targetId=$('selTarget').value, taskId=$('selTask').value;
   await updateRoom(ROOM, st=>{
     const guesser=findPlayer(st,MYID), target=findPlayer(st,targetId);
     if(target.taskAnnounced){ pushLog(st,'該任務已公告，無法再猜。'); return; }
     if(target.hiddenTaskId===taskId){
       guesser.gp+=1; guesser.funds+=2; guesser.guessCorrect++;
       target.taskDone=true; target.taskAnnounced=true;
       target.guessedAgainstCount++;
       pushLog(st, guesser.name+' 猜中了 '+target.name+' 的隱藏任務！獎勵轉移給猜中者。');
     } else {
       guesser.funds-=1; guesser.guessWrong++;
       pushLog(st, guesser.name+' 猜錯了 '+target.name+' 的隱藏任務，經費-1。');
     }
   });
   await refresh();
 };

 document.querySelectorAll('[data-vote]').forEach(btn=>{
   btn.onclick=async ()=>{
     const v=btn.dataset.vote;
     await updateRoom(ROOM, st=>{ if(st.currentStory) st.currentStory.votes[MYID]=v; });
     await refresh();
   };
 });
 if($('btnResolveStory')) $('btnResolveStory').onclick=async ()=>{
   await updateRoom(ROOM, st=>resolveStory(st));
   await refresh();
 };

 if($('btnEndGame')) $('btnEndGame').onclick=async ()=>{
   await updateRoom(ROOM, st=>{ st.phase='ended'; pushLog(st,'遊戲結束，進入結算。'); });
   await refresh();
 };
}

function triggerStory(state){
 if(state.currentStory) return;
 if(state.storyUnlocked.length<6){
   const remain = STORY_CHAPTERS.filter(c=>!state.storyUnlocked.includes(c.id));
   const pick = remain[Math.floor(Math.random()*remain.length)];
   state.currentStory = {chapterId:pick.id, votes:{}, isFinal:false};
   pushLog(state, '觸發養成故事小遊戲：《'+pick.title+'》，全場投票決定劇情走向！');
 } else if(!state.finalResolved){
   state.currentStory = {votes:{}, isFinal:true};
   pushLog(state, '6則章節全部解鎖！觸發終章〈畢業前夕的抉擇〉，全場投票決定最終結局！');
 } else {
   pushLog(state, '小研的故事已經說完了（都市傳說已無新進展）。');
 }
}
function resolveStory(state){
 const story=state.currentStory; if(!story) return;
 const votesA=Object.values(story.votes).filter(v=>v==='a').length;
 const votesB=Object.values(story.votes).filter(v=>v==='b').length;
 const winner = votesB>votesA? 'b':'a';
 if(story.isFinal){
   state.finalEnding = winner; state.finalResolved=true;
   pushLog(state, '終章投票結果：選項'+winner.toUpperCase()+' 勝出！');
 } else {
   const ch = STORY_CHAPTERS.find(c=>c.id===story.chapterId);
   const opt = ch[winner];
   const r = opt.fx();
   const triggerPlayer = state.players.find(p=>p.pos===36) || state.players[state.currentIdx];
   if(r.xiaoyan) state.xiaoyanFavor+=r.xiaoyan;
   if(r.allD) state.players.forEach(p=>applyDelta(p,r.allD));
   if(r.triggerD && triggerPlayer) applyDelta(triggerPlayer,r.triggerD);
   state.storyUnlocked.push(ch.id);
   pushLog(state, '《'+ch.title+'》投票結果：選項'+winner.toUpperCase()+'勝出——'+opt.label);
   state.currentStory=null;
   if(state.storyUnlocked.length>=6 && !state.finalResolved){ triggerStory(state); return; }
 }
 state.currentStory=null;
}

/* ============ 即時同步 ============ */
let unsubRef=null;
async function refresh(){
 const st = await safeLoadRoom(ROOM);
 if(st){ STATE=st; render(); }
}
function startPolling(){
 if(unsubRef) { unsubRef.off('value'); }
 const r = roomRef(ROOM);
 r.on('value', snap=>{
   if(snap.exists()){ STATE = normalizeState(snap.val()); render(); }
 });
 unsubRef = r;
}

render();
})();
</script>
